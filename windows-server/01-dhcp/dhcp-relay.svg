<svg xmlns="http://www.w3.org/2000/svg" width="900" height="285" viewBox="0 0 900 285" role="img" aria-label="DHCP Relay" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect width="900" height="285" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450.0" y="34" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">DHCP Relay</text>
<rect x="30" y="90" width="200" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="130.0" y="135.4" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Client</text>
<text x="130.0" y="154.4" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">VLAN / subnet 192.168.2.0/24</text>
<rect x="350" y="90" width="200" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="450.0" y="135.4" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Router + Relay Agent</text>
<text x="450.0" y="154.4" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">192.168.2.1</text>
<rect x="670" y="90" width="200" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="770.0" y="135.4" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">DHCP Server</text>
<text x="770.0" y="154.4" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">192.168.1.1</text>
<line x1="230" y1="125" x2="350" y2="125" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<line x1="350" y1="165" x2="230" y2="165" stroke="#1f2937" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<line x1="550" y1="125" x2="670" y2="125" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<line x1="670" y1="165" x2="550" y2="165" stroke="#1f2937" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="290" y="112" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">Discover</text>
<text x="290" y="182" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">Offer</text>
<text x="610" y="112" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">Discover (unicast)</text>
<text x="610" y="182" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">Offer (unicast)</text>
<text x="290" y="215" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#dc2626">broadcast</text>
<text x="610" y="215" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16a34a">unicast across the router</text>
<text x="450" y="255" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">Broadcasts do not cross routers. The relay agent forwards them to the DHCP server as unicast.</text>
</svg>
