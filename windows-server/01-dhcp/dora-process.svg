<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-label="DHCP DORA process" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect width="900" height="510" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450.0" y="34" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">DHCP DORA process</text>
<rect x="120" y="55" width="200" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="220.0" y="84.9" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">DHCP Client</text>
<rect x="580" y="55" width="200" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="680.0" y="84.9" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">DHCP Server</text>
<line x1="220" y1="105" x2="220" y2="440" stroke="#9ca3af" stroke-width="2"/>
<line x1="680" y1="105" x2="680" y2="440" stroke="#9ca3af" stroke-width="2"/>
<line x1="222" y1="160" x2="678" y2="160" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="450" y="136" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">1  Discover</text>
<text x="450" y="152" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">broadcast: "Is there a DHCP server?"</text>
<line x1="678" y1="240" x2="222" y2="240" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="450" y="216" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">2  Offer</text>
<text x="450" y="232" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">"I can give you 192.168.1.50"</text>
<line x1="222" y1="320" x2="678" y2="320" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="450" y="296" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">3  Request</text>
<text x="450" y="312" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">"I accept 192.168.1.50"</text>
<line x1="678" y1="400" x2="222" y2="400" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="450" y="376" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">4  ACK</text>
<text x="450" y="392" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">"Confirmed: mask, gateway, DNS, lease"</text>
<text x="450" y="480" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">Client ports: UDP 68 &#183; Server port: UDP 67</text>
</svg>
