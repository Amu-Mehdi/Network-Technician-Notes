<svg xmlns="http://www.w3.org/2000/svg" width="900" height="315" viewBox="0 0 900 315" role="img" aria-label="Lease lifecycle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect width="900" height="315" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450.0" y="34" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">Lease lifecycle</text>
<line x1="100" y1="140" x2="820" y2="140" stroke="#1f2937" stroke-width="3"/>
<circle cx="100" cy="140" r="8" fill="#2563eb"/>
<text x="100" y="112" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Lease obtained</text>
<text x="100" y="176" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">0%</text>
<circle cx="450" cy="140" r="8" fill="#2563eb"/>
<text x="450" y="112" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">T1: renew</text>
<text x="450" y="176" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">50%</text>
<circle cx="700" cy="140" r="8" fill="#2563eb"/>
<text x="700" y="112" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">T2: rebind</text>
<text x="700" y="176" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">87.5%</text>
<circle cx="820" cy="140" r="8" fill="#2563eb"/>
<text x="820" y="112" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Lease expires</text>
<text x="820" y="176" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">100%</text>
<rect x="100" y="205" width="350" height="38" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="275" y="229" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937">Client uses the IP normally</text>
<rect x="450" y="205" width="250" height="38" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="575" y="229" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937">Asks the same server to renew</text>
<rect x="700" y="205" width="120" height="38" rx="8" fill="#fee2e2" stroke="#dc2626"/><text x="760" y="229" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937">Any server</text>
<text x="450" y="285" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">If renewal succeeds, the lease timer restarts and the IP address stays the same.</text>
</svg>
